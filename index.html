<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Order</title>
<!-- Open the connection to Google while the page is still loading. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f6);
    --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #fff);
    --line: color-mix(in srgb, var(--hint) 25%, transparent);
    --warn-bg: #fff4e0; --warn: #8a5300;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, "Noto Sans Khmer", sans-serif; }
  body { padding-bottom: 96px; }
  header { padding: 14px 16px 6px; }
  h1 { font-size: 19px; margin: 0; font-weight: 600; }
  .sub { color: var(--hint); font-size: 13px; margin-top: 2px; }
  .sub a { color: var(--link); text-decoration: none; }
  .banner { margin: 8px 16px; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 14px; }
  .section { padding: 6px 16px; }
  .label { font-size: 12px; color: var(--hint); text-transform: uppercase; letter-spacing: .04em; margin: 12px 0 6px; }
  .pick { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--text);
          border-radius: 10px; padding: 9px 12px; margin-bottom: 6px; font: inherit; }
  .pick b { font-weight: 600; }
  .pick span { color: var(--hint); font-size: 13px; display: block; }
  .search { width: 100%; padding: 10px 12px; border-radius: 10px; border: 0; background: var(--bg2); color: var(--text); font: inherit; }
  .cats { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 6px; position: sticky; top: 0; background: var(--bg); z-index: 5; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 99px; padding: 6px 12px; font: inherit; font-size: 13px; }
  .chip.on { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .cat-title { font-weight: 600; margin: 16px 16px 4px; }
  .item { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .item img, .item .ph { width: 96px; height: 96px; border-radius: 10px; object-fit: cover; background: var(--bg2); flex: none; }
  .item .info { flex: 1; min-width: 0; }
  .item .name { font-weight: 500; }
  .item .desc { color: var(--hint); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .price { font-size: 14px; margin-top: 2px; }
  .price s { color: var(--hint); margin-left: 6px; font-size: 13px; }
  .add { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--btn); color: var(--btn-text); font-size: 22px; line-height: 34px; }
  .custom { display: flex; gap: 8px; }
  .custom input { flex: 1; }
  .btn { border: 0; border-radius: 10px; padding: 11px 14px; background: var(--btn); color: var(--btn-text); font: inherit; font-weight: 600; }
  .btn.ghost { background: var(--bg2); color: var(--text); font-weight: 500; }
  .link { background: none; border: 0; color: var(--link); font: inherit; padding: 8px 0; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); z-index: 20; }
  .cart-lines { max-height: 30vh; overflow-y: auto; margin-bottom: 8px; }
  .cl { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 14px; }
  .cl .t { flex: 1; min-width: 0; }
  .cl .x { border: 0; background: var(--bg2); color: var(--text); border-radius: 50%; width: 26px; height: 26px; }
  .bar .btn { width: 100%; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: flex; align-items: flex-end; }
  .sheet { background: var(--bg); width: 100%; max-height: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet img { width: 100%; max-height: 320px; object-fit: cover; border-radius: 12px; margin-bottom: 10px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .qty { display: flex; align-items: center; gap: 14px; margin: 14px 0; }
  .qty button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 20px; }
  .note { width: 100%; padding: 10px 12px; border-radius: 10px; border: 0; background: var(--bg2); color: var(--text); font: inherit; }
  .center { padding: 48px 24px; text-align: center; }
  .center .big { font-size: 40px; }
  .muted { color: var(--hint); }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 110px; background: #333; color: #fff; padding: 10px 14px; border-radius: 10px; z-index: 50; font-size: 14px; }
  .skel { height: 64px; margin: 10px 16px; border-radius: 10px; background: var(--bg2); position: relative; overflow: hidden; }
  .skel::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%);
                 background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--hint) 18%, transparent), transparent);
                 animation: shimmer 1.1s infinite; }
  @keyframes shimmer { to { transform: translateX(100%); } }
  .boot { text-align: center; color: var(--hint); font-size: 14px; margin: 18px 16px 4px; }
  .boot .slow { opacity: 0; transition: opacity .4s; margin-top: 6px; font-size: 13px; }
  .loadbar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 70; overflow: hidden; background: transparent; }
  .loadbar::after { content: ''; position: absolute; top: 0; bottom: 0; width: 35%; background: var(--btn);
                    animation: slide 1s ease-in-out infinite; }
  @keyframes slide { from { left: -35%; } to { left: 100%; } }
  .hidden { display: none !important; }
  .busy { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column;
          align-items: center; justify-content: center; padding: 24px; text-align: center; }
  .spin { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--bg2); border-top-color: var(--btn);
          animation: spin .8s linear infinite; margin-bottom: 18px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .busy .lines { margin-top: 10px; color: var(--hint); font-size: 14px; }
  .shop { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .shop .info { flex: 1; min-width: 0; }
  .shop .meta { color: var(--hint); font-size: 13px; }
  .shop .go { color: var(--hint); font-size: 20px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--bg2); color: var(--hint); }
  .badge.ok { background: color-mix(in srgb, var(--btn) 15%, transparent); color: var(--btn); }
  .item.hid { opacity: .45; }
  .tog { flex: none; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 99px; padding: 6px 12px; font: inherit; font-size: 13px; }
  .tog.hide { color: #c0392b; }
  .form { padding: 4px 16px 8px; }
  .fl { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .fl > span { flex: 1; }
  .fl input[type=time], .fl input[type=number], .fl select, .fl input[type=text], .fl input[type=date] {
    padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); font: inherit; }
  .fl input[type=number] { width: 80px; }
  .fl input[type=text].wide { flex: 1.4; min-width: 0; }
  .sw { position: relative; width: 48px; height: 28px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw i { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: .15s; }
  .sw i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: .15s; }
  .sw input:checked + i { background: var(--btn); }
  .sw input:checked + i::after { transform: translateX(20px); }
  .days { display: flex; gap: 4px; }
  .days button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 13px; }
  .days button.on { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .hol { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
  .hol button { border: 0; background: var(--bg2); color: var(--text); border-radius: 50%; width: 28px; height: 28px; }
  .group-title { margin: 18px 16px 4px; font-weight: 600; }
  .err { margin: 8px 16px; padding: 10px 12px; border-radius: 10px; background: #fdecec; color: #8a1f1f; font-size: 14px; white-space: pre-line; }
  .hlink { background: none; border: 0; color: var(--link); font: inherit; padding: 0; }
  .busy .slow { margin-top: 18px; color: var(--hint); font-size: 13px; opacity: 0; transition: opacity .4s; }
</style>
</head>
<body>
<div id="app"><div class="boot">Opening the menu…<div class="slow" id="bootslow">Google is waking up the bot — a few more seconds.</div></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
<script>
(function () {
  var tg = window.Telegram && Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  var initData = tg ? tg.initData : '';
  var qs = new URLSearchParams(location.search);
  // The group button carries "round_shop" (e.g. C-20261119_S1) so the menu can be
  // drawn from this phone's saved copy before the server answers.
  var start = String((tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '');
  var rid = start.split('_')[0] || qs.get('rid') || '';
  var shopHint = start.split('_')[1] || qs.get('shop') || '';
  setTimeout(function () { var b = document.getElementById('bootslow'); if (b) b.style.opacity = 1; }, 3500);
  var API = window.OB_API;
  var app = document.getElementById('app');

  var S = { data: null, cart: [], filter: '', sending: false };

  // ---------- tiny helpers -------------------------------------------------
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (attrs[k] == null) return;
      if (k === 'text') el.textContent = attrs[k];
      else if (k === 'cls') el.className = attrs[k];
      else if (k.indexOf('on') === 0) el.addEventListener(k.substring(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      (Array.isArray(c) ? c : [c]).forEach(function (x) { if (x != null && x !== false) el.appendChild(typeof x === 'string' ? document.createTextNode(x) : x); });
    }
    return el;
  }
  function money(v, cur) {
    if (!v) return '';
    return cur === 'KHR' ? Math.round(v).toLocaleString('en-US') + '៛' : '$' + Number(v).toFixed(2);
  }
  function haptic(kind) { try { tg && tg.HapticFeedback && tg.HapticFeedback[kind === 'ok' ? 'notificationOccurred' : 'impactOccurred'](kind === 'ok' ? 'success' : 'light'); } catch (e) {} }
  function toast(msg) {
    var t = h('div', { cls: 'toast', text: msg });
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  }
  function lineText(l) {
    var b = [(l.qty > 1 ? l.qty + '× ' : '') + l.item];
    if (l.sugar !== '' && l.sugar != null) b.push(l.sugar + '%');
    if (l.ice) b.push(l.ice);
    if (l.opts) b.push(l.opts);
    if (l.part) { var pp = String(l.part).split('of'); b.push(Number(pp[0]) >= Number(pp[1]) ? 'whole offer' : pp[0] + ' of ' + pp[1]); }
    if (l.note) b.push('“' + l.note + '”');
    return b.join(' · ');
  }
  function api(body) {
    body.ob_app = 1; body.initData = initData; body.rid = rid;
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }
  function cacheKey() { return 'ob_load_' + rid; }
  function shopKey(id) { return 'ob_shop_' + id; }
  function loading(on) {
    var b = document.querySelector('.loadbar');
    if (on && !b) document.body.appendChild(h('div', { cls: 'loadbar' }));
    if (!on && b) b.remove();
  }
  /** Redraw without losing the scroll position or the search box focus. */
  function rerender() {
    var y = window.scrollY, typing = document.activeElement && document.activeElement.classList.contains('search');
    render();
    window.scrollTo(0, y);
    if (typing) { var s = document.querySelector('.search'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }
  }

  // ---------- start ---------------------------------------------------------
  if (!API || /PASTE_/.test(API)) { return screen('⚙️', 'Setup needed', 'Put your web app URL in config.js.'); }
  if (!initData) { return screen('📱', 'Open this from Telegram', 'Tap ✏️ Order on the round message in your team group.'); }

  // Organiser views, opened from /shops in the private chat.
  if (qs.get('view') === 'shops') { adminShops(); return; }
  if (qs.get('view') === 'settings') { adminSettings(); return; }

  // 1. Draw at once from this phone's copy: this round as last seen, or else
  //    the shop's menu from an earlier day. Sending waits for the real answer.
  try {
    Object.keys(localStorage).forEach(function (k) {            // drop other days' rounds
      if (k.indexOf('ob_load_') === 0 && k !== cacheKey()) localStorage.removeItem(k);
    });
    var cached = JSON.parse(localStorage.getItem(cacheKey()) || 'null');
    if (!cached && shopHint) {
      var sm = JSON.parse(localStorage.getItem(shopKey(shopHint)) || 'null');
      if (sm && sm.menu && sm.menu.length) cached = {
        ok: true, mode: 'open', provisional: true,
        round: { rid: rid, kind: rid.charAt(0) === 'L' ? 'lunch' : 'coffee', cutoff: '' },
        shop: sm.shop, menu: sm.menu, sugar: sm.sugar, ice: sm.ice,
        mine: [], last: [], friends: [], redo: [], popular: [], admin: ''
      };
    }
    if (cached) {
      cached.provisional = true;
      S.data = cached; S.cart = (cached.mine || []).slice(); render();
    }
  } catch (e) {}

  // 2. Ask the server; a thin bar at the top shows it's still checking.
  loading(true);
  api({ op: 'load' }).then(function (d) {
    loading(false);
    if (!d.ok) return screen('⚠️', 'Could not load', d.error || 'Try again.');
    var hadCart = S.data && S.cart.length;
    S.data = d;
    if (!hadCart) S.cart = (d.mine || []).slice();
    try {
      localStorage.setItem(cacheKey(), JSON.stringify(d));
      if (d.shop && d.shop.id && d.menu && d.menu.length) {
        localStorage.setItem(shopKey(d.shop.id), JSON.stringify({ shop: d.shop, menu: d.menu, sugar: d.sugar, ice: d.ice }));
      }
    } catch (e) {}
    rerender();
  }).catch(function () {
    loading(false);
    if (!S.data || S.data.provisional) screen('📶', 'No connection', 'Check your internet and reopen the menu.');
  });

  // ---------- organiser: shops and menu review ------------------------------
  function back(fn) {
    if (!tg || !tg.BackButton) return;
    tg.BackButton.offClick(tg.__obBack || function () {});
    if (fn) { tg.__obBack = fn; tg.BackButton.onClick(fn); tg.BackButton.show(); } else tg.BackButton.hide();
  }

  function dropBar() { var b = document.querySelector('.bar'); if (b) b.remove(); }

  function adminShops() {
    back(null); dropBar();
    document.body.style.paddingBottom = '24px';
    api({ op: 'shops' }).then(function (d) {
      if (!d.ok) return screen('🔒', 'Not available', d.error || '');
      app.innerHTML = '';
      var has = d.shops.filter(function (s) { return s.items; }).length;
      app.appendChild(h('header', null, h('h1', { text: 'Your shops' }),
        h('div', { cls: 'sub' }, has + ' of ' + d.shops.length + ' have a menu · tap one to review or edit · ',
          h('button', { cls: 'hlink', text: '⚙️ Settings', onclick: adminSettings }))));
      var kindIcon = { coffee: '☕', lunch: '🍱', both: '☕🍱' };
      d.shops.forEach(function (sh) {
        app.appendChild(h('div', { cls: 'shop' + (sh.active ? '' : ' hid'), onclick: function () { adminPreview(sh.id); } },
          h('div', { cls: 'info' },
            h('div', { cls: 'name', text: (kindIcon[sh.kind] || '') + ' ' + sh.name + (sh.active ? '' : ' (paused)') }),
            h('div', { cls: 'meta', text: sh.id + ' · ' + sh.app })),
          sh.items ? h('span', { cls: 'badge ok', text: sh.items + ' items' + (sh.hidden ? ' · ' + sh.hidden + ' hidden' : '') })
                   : h('span', { cls: 'badge', text: 'no menu' }),
          h('span', { cls: 'go', text: '›' })));
      });
    }).catch(function () { screen('📶', 'No connection', 'Try again.'); });
  }

  function adminPreview(id) {
    back(adminShops); dropBar();
    app.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    window.scrollTo(0, 0);
    api({ op: 'preview', shop: id }).then(function (d) {
      if (!d.ok) return screen('⚠️', 'Could not load', d.error || '');
      var filter = '';
      app.innerHTML = '';
      var shown = d.menu.filter(function (m) { return m.available; }).length;
      var sub = h('div', { cls: 'sub', text: d.shop.app + ' · ' + shown + ' shown' + (d.menu.length > shown ? ', ' + (d.menu.length - shown) + ' hidden' : '') +
                                             (d.shop.at ? ' · imported ' + d.shop.at : '') });
      var title = h('h1', { text: d.shop.name });
      app.appendChild(h('header', null, title, sub));
      app.appendChild(shopEditor(d.shop, function (name) { title.textContent = name; }));
      if (!d.menu.length) {
        app.appendChild(h('div', { cls: 'center muted', text: 'No menu imported yet. Open this shop\'s share link in a browser and run the 📋 bookmark. Until then the team browses in the app and types their order.' }));
        return;
      }
      app.appendChild(h('div', { cls: 'banner', text: '👀 The team sees this menu without the greyed-out items. Tap Hide or Show — it\'s saved straight away.' }));
      app.appendChild(h('div', { cls: 'section' }, h('input', { cls: 'search', type: 'search', placeholder: 'Search this menu',
        oninput: function (e) { filter = e.target.value.trim().toLowerCase(); draw(); } })));
      var box = h('div');
      app.appendChild(box);
      function draw() {
        box.innerHTML = '';
        var cats = [];
        d.menu.forEach(function (m) { if (cats.indexOf(m.cat) === -1) cats.push(m.cat); });
        cats.forEach(function (c) {
          var items = d.menu.filter(function (m) { return m.cat === c && (!filter || m.name.toLowerCase().indexOf(filter) > -1); });
          if (!items.length) return;
          box.appendChild(h('div', { cls: 'cat-title', text: c }));
          items.forEach(function (m) {
            var tog = h('button', { cls: 'tog' + (m.available ? ' hide' : ''), text: m.available ? 'Hide' : 'Show' });
            var row = h('div', { cls: 'item' + (m.available ? '' : ' hid') },
              m.img ? h('img', { src: m.img, loading: 'lazy', alt: '' }) : h('div', { cls: 'ph' }),
              h('div', { cls: 'info' }, h('div', { cls: 'name', text: m.name }),
                h('div', { cls: 'price' }, money(m.price, m.cur), m.was && m.was > m.price ? h('s', { text: money(m.was, m.cur) }) : null),
                m.opts && m.opts.length ? h('div', { cls: 'desc', text: m.opts.map(function (o) { return o.group; }).join(' · ') }) : null),
              tog);
            tog.onclick = function () {
              var want = !m.available;
              m.available = want;                       // show the change at once; undo if saving fails
              row.classList.toggle('hid', !want); tog.textContent = want ? 'Hide' : 'Show'; tog.classList.toggle('hide', want);
              haptic();
              api({ op: 'toggle', item: m.id, available: want }).then(function (r) {
                if (!r.ok) throw new Error(r.error);
                var n = d.menu.filter(function (x) { return x.available; }).length;
                sub.textContent = d.shop.app + ' · ' + n + ' shown' + (d.menu.length > n ? ', ' + (d.menu.length - n) + ' hidden' : '') + (d.shop.at ? ' · imported ' + d.shop.at : '');
              }).catch(function (e) {
                m.available = !want;
                row.classList.toggle('hid', want); tog.textContent = !want ? 'Hide' : 'Show'; tog.classList.toggle('hide', !want);
                toast('Not saved: ' + (e.message || 'no connection'));
              });
            };
            box.appendChild(row);
          });
        });
      }
      draw();
    }).catch(function () { screen('📶', 'No connection', 'Try again.'); });
  }

  function sw(checked, onchange) {
    var inp = h('input', { type: 'checkbox' });
    inp.checked = !!checked;
    if (onchange) inp.onchange = function () { onchange(inp.checked); };
    return { el: h('label', { cls: 'sw' }, inp, h('i')), input: inp };
  }

  /** Name, coffee/lunch, on/off for one shop. */
  function shopEditor(shop, onRenamed) {
    var name = h('input', { type: 'text', cls: 'wide', value: shop.name });
    var kind = shop.kind;
    var seg = h('div', { cls: 'opts' }, ['coffee', 'lunch', 'both'].map(function (k) {
      return h('button', { cls: 'chip' + (kind === k ? ' on' : ''), text: { coffee: '☕ Coffee', lunch: '🍱 Lunch', both: 'Both' }[k],
        onclick: function () { kind = k; [].forEach.call(seg.children, function (b, i) { b.classList.toggle('on', ['coffee', 'lunch', 'both'][i] === k); }); } });
    }));
    var on = sw(shop.active !== false);

    var err = h('div');
    save.onclick = function () {

      h('div', { cls: 'fl' }, h('span', { text: 'Used for' }), seg),
      h('div', { cls: 'fl' }, h('span', null, 'Show in my pick list', h('div', { cls: 'muted', style: 'font-size:12px', text: 'Off = hidden when you choose a shop; history is kept' })), on.el),
      save, err);
  }

  function adminSettings() {
    back(qs.get('view') === 'shops' ? adminShops : null);
    window.scrollTo(0, 0);
    app.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    api({ op: 'settings_get' }).then(function (d) {
      if (!d.ok) return screen('🔒', 'Not available', d.error || '');
      var v = d.values, hol = (d.holidays || []).slice();
      app.innerHTML = '';
      document.body.style.paddingBottom = '96px';
      app.appendChild(h('header', null, h('h1', { text: '⚙️ Settings' }),
        h('div', { cls: 'sub', text: 'Changes apply from the next round.' })));

      function timeRow(label, key) {
        var t = h('input', { type: 'time', value: v[key] || '' });
        t.oninput = function () { v[key] = t.value; };
        return h('div', { cls: 'fl' }, h('span', { text: label }), t);
      }
      function round(K, icon, title) {
        var s1 = sw(/^true$/i.test(v[K + '_ENABLED']), function (c) { v[K + '_ENABLED'] = c ? 'TRUE' : 'FALSE'; });
        return [h('div', { cls: 'group-title', text: icon + ' ' + title }),
          h('div', { cls: 'form' },
            h('div', { cls: 'fl' }, h('span', { text: 'Run this round on workdays' }), s1.el),
            timeRow('Ask me to pick the shop', K + '_ASK'),
            timeRow('Remind the team', K + '_NUDGE'),
            timeRow('Cut-off', K + '_CUTOFF'))];
      }
      round('COFFEE', '☕', 'Coffee').forEach(function (x) { app.appendChild(x); });
      round('LUNCH', '🍱', 'Lunch').forEach(function (x) { app.appendChild(x); });

      // workdays
      var wd = String(v.WORKDAYS || '').split(',').map(Number);
      var days = h('div', { cls: 'days' }, ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(function (l, i) {
        var b = h('button', { cls: wd.indexOf(i + 1) > -1 ? 'on' : '', text: l });
        b.onclick = function () {
          var n = i + 1, at = wd.indexOf(n);
          if (at > -1) wd.splice(at, 1); else wd.push(n);
          b.classList.toggle('on', at === -1);
          v.WORKDAYS = wd.sort().join(',');
        };
        return b;
      }));
      app.appendChild(h('div', { cls: 'group-title', text: '📅 Days' }));
      var holBox = h('div');
      var addDate = h('input', { type: 'date' });
      function drawHol() {
        holBox.innerHTML = '';
        if (!hol.length) holBox.appendChild(h('div', { cls: 'muted', style: 'font-size:14px;padding:6px 0', text: 'No days off planned.' }));
        hol.forEach(function (dte, i) {
          var nice = new Date(dte + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
          holBox.appendChild(h('div', { cls: 'hol' }, h('span', { text: nice }),
            h('button', { text: '×', 'aria-label': 'Remove', onclick: function () { hol.splice(i, 1); drawHol(); } })));
        });
      }
      drawHol();
      app.appendChild(h('div', { cls: 'form' },
        h('div', { cls: 'fl' }, h('span', { text: 'Workdays' }), days),
        h('div', { style: 'padding:10px 0 0' }, h('div', { text: 'Days off (holidays, leave)' }), holBox,
          h('div', { cls: 'fl', style: 'border:0' }, addDate,
            h('button', { cls: 'btn ghost', text: 'Add', onclick: function () {
              if (!addDate.value) return toast('Pick a date first.');
              if (hol.indexOf(addDate.value) === -1) hol.push(addDate.value);
              hol.sort(); addDate.value = ''; drawHol();
            } })))));

      // behaviour
      var remind = h('input', { type: 'number', min: 1, max: 120, value: v.PICK_REMIND_MIN, placeholder: 'off' });
      remind.oninput = function () { v.PICK_REMIND_MIN = remind.value; };
      var minOrd = h('input', { type: 'number', min: 1, max: 120, value: v.MIN_ORDER_MIN });
      minOrd.oninput = function () { v.MIN_ORDER_MIN = minOrd.value; };
      var show = h('select', null, [['items', 'Who + what they ordered'], ['names', 'Only who ordered'], ['count', 'Only how many']].map(function (o) {
        var e = h('option', { value: o[0], text: o[1] }); if (v.SHOW_ORDERS === o[0]) e.selected = true; return e;
      }));
      show.onchange = function () { v.SHOW_ORDERS = show.value; };
      var late = h('select', null, [['ask', 'Ask me to approve'], ['no', 'Refuse']].map(function (o) {
        var e = h('option', { value: o[0], text: o[1] }); if (v.LATE_ORDERS === o[0]) e.selected = true; return e;
      }));
      late.onchange = function () { v.LATE_ORDERS = late.value; };
      var sugar = h('input', { type: 'text', value: String(v.SUGAR_LEVELS || '').replace(/,/g, ', '), inputmode: 'numeric' });
      sugar.oninput = function () { v.SUGAR_LEVELS = sugar.value; };
      app.appendChild(h('div', { cls: 'group-title', text: '🔧 How it behaves' }));
      app.appendChild(h('div', { cls: 'form' },
        h('div', { cls: 'fl' }, h('span', null, 'Remind me to pick after (min)', h('div', { cls: 'muted', style: 'font-size:12px', text: 'Blank = no reminder' })), remind),
        h('div', { cls: 'fl' }, h('span', { text: 'Team always gets at least (min)' }), minOrd),
        h('div', { cls: 'fl' }, h('span', { text: 'Team sees in the group' }), show),
        h('div', { cls: 'fl' }, h('span', { text: 'Orders after cut-off' }), late),
        h('div', { cls: 'fl' }, h('span', { text: 'Sugar buttons (%)' }), sugar)));

      var err = h('div');
      app.appendChild(err);
      var bar = h('div', { cls: 'bar' }, h('button', { cls: 'btn', text: 'Save settings', onclick: function () {
        err.innerHTML = '';
        var stop = busy('Saving settings…');
        api({ op: 'settings_save', values: v, holidays: hol }).then(function (r) {
          stop();
          if (!r.ok) { err.appendChild(h('div', { cls: 'err', text: r.error })); err.scrollIntoView({ behavior: 'smooth' }); haptic(); return; }
          haptic('ok');
          toast(r.changed.length ? 'Saved ✓ — ' + r.changed.length + ' change' + (r.changed.length > 1 ? 's' : '') : 'Nothing changed');
        }).catch(function () { stop(); err.appendChild(h('div', { cls: 'err', text: 'No connection — not saved.' })); });
      } }));
      var old = document.querySelector('.bar'); if (old) old.remove();
      document.body.appendChild(bar);
    }).catch(function () { screen('📶', 'No connection', 'Try again.'); });
  }

  // ---------- screens -------------------------------------------------------
  function screen(icon, title, msg, extra) {
    app.innerHTML = '';
    app.appendChild(h('div', { cls: 'center' }, h('div', { cls: 'big', text: icon }), h('h1', { text: title }),
      h('p', { cls: 'muted', text: msg }), extra || null));
    document.body.style.paddingBottom = '0';
  }

  function render() {
    var d = S.data;
    if (d.mode === 'none')    return screen('☕', 'No round right now', d.message || '');
    if (d.mode === 'ordered') return screen('✅', 'Already ordered', 'This round has been ordered — see you next time.');
    if (d.mode === 'closed')  return screen('🔒', 'Round closed', 'Ask ' + d.admin + ' directly.');

    app.innerHTML = '';
    var shop = d.shop;
    app.appendChild(h('header', null,
      h('h1', { text: shop.name || 'Today\'s order' }),
      h('div', { cls: 'sub' }, (shop.app ? shop.app + ' · ' : ''),
        d.mode === 'open' ? (d.provisional ? 'checking today\'s order…' : 'order by ' + d.round.cutoff) : '',
        shop.url ? [' · ', h('a', { href: shop.url, target: '_blank', text: 'open in ' + (shop.app || 'app'), onclick: function (e) { if (tg) { e.preventDefault(); tg.openLink(shop.url); } } })] : null)));

    if (d.mode === 'redo') app.appendChild(h('div', { cls: 'banner', text: '😕 ' + d.redo.join(', ') + ' is not available. Please pick something else.' }));
    if (d.mode === 'late') app.appendChild(h('div', { cls: 'banner', text: '🔒 The round is closed — your order goes to ' + d.admin + ' for approval.' }));

    // quick picks
    var quick = h('div', { cls: 'section' });
    if (d.last && d.last.length) {
      quick.appendChild(h('div', { cls: 'label', text: 'Quick picks' }));
      quick.appendChild(pickBtn('🔁 Same as last time', d.last));
    }
    (d.friends || []).slice(0, 6).forEach(function (f, i) {
      if (i === 0 && !(d.last && d.last.length)) quick.appendChild(h('div', { cls: 'label', text: 'Quick picks' }));
      quick.appendChild(pickBtn('👥 Same as ' + f.name, f.lines));
    });
    if (quick.childNodes.length) app.appendChild(quick);

    var hasMenu = d.menu && d.menu.length;
    if (hasMenu) {
      app.appendChild(h('div', { cls: 'section' }, h('input', { cls: 'search', type: 'search', placeholder: 'Search the menu', value: S.filter,
        oninput: function (e) { S.filter = e.target.value; drawMenu(); } })));
      var cats = [];
      d.menu.forEach(function (m) { if (cats.indexOf(m.cat) === -1) cats.push(m.cat); });
      if (cats.length > 1) {
        app.appendChild(h('div', { cls: 'cats' }, cats.map(function (c) {
          return h('button', { cls: 'chip', text: c, onclick: function () {
            var t = document.getElementById('cat-' + cats.indexOf(c));
            if (t) window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 54, behavior: 'smooth' });
          } });
        })));
      }
      app.appendChild(h('div', { id: 'menu' }));
      drawMenu();
    } else if (d.popular && d.popular.length) {
      var pop = h('div', { cls: 'section' }, h('div', { cls: 'label', text: 'Ordered here before' }));
      d.popular.forEach(function (l) { pop.appendChild(pickBtn(lineText(l), [l], true)); });
      app.appendChild(pop);
    }

    // type your own
    var inp = h('input', { cls: 'search', placeholder: d.round.kind === 'coffee' ? 'e.g. Iced latte 50% less ice' : 'e.g. Fried rice with egg' });
    app.appendChild(h('div', { cls: 'section' },
      h('div', { cls: 'label', text: hasMenu ? 'Not on the list?' : 'Type your order' }),
      !hasMenu && shop.url ? h('p', { cls: 'muted', style: 'margin:0 0 8px;font-size:13px', text: 'This shop\'s menu isn\'t in the bot yet — check it in ' + (shop.app || 'the app') + ', then type what you want.' }) : null,
      h('div', { cls: 'custom' }, inp, h('button', { cls: 'btn', text: 'Add', onclick: function () {
        var v = inp.value.trim();
        if (!v) return;
        S.cart.push({ item: v, qty: 1, custom: true, price: 0 });
        inp.value = ''; haptic(); drawBar(); toast('Added ✓');
      } }))));

    if (d.mode === 'open') {
      app.appendChild(h('div', { cls: 'section' }, h('button', { cls: 'link', text: '🙅 Skip today', onclick: function () { send(true); } })));
    }
    if (!document.querySelector('.bar')) document.body.appendChild(h('div', { cls: 'bar' }));
    drawBar();
  }

  function pickBtn(title, lines, plain) {
    return h('button', { cls: 'pick', onclick: function () {
      S.cart = lines.map(function (l) { return Object.assign({}, l); });
      haptic(); drawBar(); toast('Added to your order — check it below.');
    } }, h('b', { text: title }), plain ? null : h('span', { text: lines.map(lineText).join(' + ') }));
  }

  function drawMenu() {
    var box = document.getElementById('menu');
    if (!box) return;
    box.innerHTML = '';
    var f = S.filter.trim().toLowerCase();
    var cats = [];
    S.data.menu.forEach(function (m) { if (cats.indexOf(m.cat) === -1) cats.push(m.cat); });
    cats.forEach(function (c, ci) {
      var items = S.data.menu.filter(function (m) { return m.cat === c && (!f || (m.name + ' ' + m.desc).toLowerCase().indexOf(f) > -1); });
      if (!items.length) return;
      box.appendChild(h('div', { cls: 'cat-title', id: 'cat-' + ci, text: c }));
      items.forEach(function (m) {
        box.appendChild(h('div', { cls: 'item', onclick: function () { openItem(m); } },
          m.img ? h('img', { src: m.img, loading: 'lazy', alt: '' }) : h('div', { cls: 'ph' }),
          h('div', { cls: 'info' }, h('div', { cls: 'name', text: m.name }),
            m.alt ? h('div', { cls: 'desc', text: m.alt }) : (m.desc && m.desc !== m.name ? h('div', { cls: 'desc', text: m.desc }) : null),
            m.bundle > 1
              ? h('div', { cls: 'price' }, money(m.price / m.bundle, m.cur) + ' each · offer for ' + m.bundle)
              : h('div', { cls: 'price' }, money(m.price, m.cur), m.was && m.was > m.price ? h('s', { text: money(m.was, m.cur) }) : null),
            m.bundle > 1 && m.open ? h('div', { cls: 'desc', style: 'color:var(--link)', text: '🤝 ' + m.open.names.join(', ') + ' needs ' + m.open.need + ' more — join in' }) : null),
          h('button', { cls: 'add', text: '+', 'aria-label': 'Add ' + m.name })));
      });
    });
    if (!box.childNodes.length) box.appendChild(h('p', { cls: 'center muted', text: 'Nothing matches “' + S.filter + '”. Type it below instead.' }));
  }

  // ---------- item sheet ------------------------------------------------------
  function openItem(m) {
    var d = S.data, coffee = d.round.kind === 'coffee';
    var groups = (m.opts || []).slice();
    var hasSugar = groups.some(function (g) { return /sugar|sweet|ស្ករ/i.test(g.group); });
    var hasIce = groups.some(function (g) { return /ice|hot|temp|ទឹកកក/i.test(g.group); });
    if (coffee && !hasSugar) groups.push({ group: 'Sugar', choices: d.sugar.map(function (s) { return s + '%'; }), _sugar: true });
    if (coffee && !hasIce) groups.push({ group: 'Ice', choices: ['Ice', 'Less ice', 'Hot', 'No ice'], _ice: true });
    var bn = m.bundle > 1 ? m.bundle : 0;
    if (bn) groups.unshift({ group: 'Offer for ' + bn, choices: ['Join · 1 share', 'All ' + bn + ' for me'], _part: true });
    var picked = {}, qty = 1;
    if (bn) picked[0] = ['Join · 1 share'];
    var note = h('input', { cls: 'note', placeholder: 'Note for the shop (optional)' });
    var addBtn = h('button', { cls: 'btn', style: 'width:100%' });
    function take() { return bn ? ((picked[0] || [])[0] === 'All ' + bn + ' for me' ? bn : 1) : 0; }
    function label() {
      addBtn.textContent = bn ? 'Add · ' + money(m.price / bn * take(), m.cur)
        : 'Add' + (qty > 1 ? ' ' + qty : '') + (m.price ? ' · ' + money(m.price * qty, m.cur) : '');
    }
    var qtyTxt = h('b', { text: '1' });
    var bg = h('div', { cls: 'sheet-bg', onclick: function (e) { if (e.target === bg) bg.remove(); } },
      h('div', { cls: 'sheet' },
        m.img ? h('img', { src: m.img, alt: '' }) : null,
        h('h1', { text: m.name }),
        m.alt ? h('div', { cls: 'muted', text: m.alt }) : null,
        h('div', { cls: 'price' }, money(m.price, m.cur), m.was && m.was > m.price ? h('s', { text: money(m.was, m.cur) }) : null),
        groups.map(function (g, gi) {
          return h('div', null, h('div', { cls: 'label', text: g.group }), h('div', { cls: 'opts' }, g.choices.map(function (c) {
            var b = h('button', { cls: 'chip', text: c, onclick: function () {
              var cur = picked[gi] || [];
              if (g.multi) { var i = cur.indexOf(c); if (i > -1) cur.splice(i, 1); else cur.push(c); picked[gi] = cur; }
              else if (g._part) picked[gi] = [c];
              else picked[gi] = (cur[0] === c) ? [] : [c];
              [].forEach.call(b.parentNode.children, function (x) { x.classList.toggle('on', (picked[gi] || []).indexOf(x.textContent) > -1); });
              haptic(); label();
            } });
            if (g._part && c === 'Join · 1 share') b.classList.add('on');
            return b;
          })));
        }),
        bn ? h('div', { cls: 'muted', style: 'font-size:13px;margin:12px 0', text: 'The offer only works when ' + bn + ' drinks are ordered together. If nobody joins by cut-off, you\'ll be asked to pick again.' }) :
        h('div', { cls: 'qty' }, h('button', { text: '−', onclick: function () { qty = Math.max(1, qty - 1); qtyTxt.textContent = qty; label(); } }),
          qtyTxt, h('button', { text: '+', onclick: function () { qty = Math.min(20, qty + 1); qtyTxt.textContent = qty; label(); } })),
        note, h('div', { style: 'height:12px' }), addBtn));
    addBtn.onclick = function () {
      var line = { id: m.id, item: m.name, qty: bn ? 1 : qty, sugar: '', ice: '', opts: '', note: note.value.trim(), price: bn ? m.price / bn * take() : m.price, cur: m.cur, part: bn ? take() + 'of' + bn : '' };
      var extra = [];
      groups.forEach(function (g, gi) {
        var v = picked[gi] || [];
        if (!v.length || g._part) return;
        if (g._sugar || /sugar|sweet|ស្ករ/i.test(g.group)) {
          var n = String(v[0]).match(/\d+/); line.sugar = n ? Number(n[0]) : ''; if (!n) extra.push(v[0]);
        } else if (g._ice || /ice|hot|temp|ទឹកកក/i.test(g.group)) line.ice = String(v[0]).toLowerCase();
        else extra.push((g.choices.length <= 3 && v.length === 1 ? g.group + ' ' : '') + v.join(', '));
      });
      line.opts = extra.join(', ');
      S.cart.push(line);
      haptic(); bg.remove(); drawBar(); toast('Added ✓ — tap Send order when you\'re done');
    };
    label();
    document.body.appendChild(bg);
  }

  // ---------- cart bar --------------------------------------------------------
  function drawBar() {
    var bar = document.querySelector('.bar');
    if (!bar) return;
    bar.innerHTML = '';
    if (!S.cart.length) {
      bar.appendChild(h('div', { cls: 'muted', style: 'text-align:center;padding:6px 0', text: 'Tap an item to add it to your order' }));
      return;
    }
    var cur = (S.data.menu && S.data.menu[0] && S.data.menu[0].cur) || 'USD';
    var total = S.cart.reduce(function (a, l) { return a + (l.cur === cur ? (Number(l.price) || 0) * (l.qty || 1) : 0); }, 0);
    bar.appendChild(h('div', { cls: 'cart-lines' }, S.cart.map(function (l, i) {
      return h('div', { cls: 'cl' }, h('div', { cls: 't', text: lineText(l) }),
        h('button', { cls: 'x', text: '×', 'aria-label': 'Remove', onclick: function () { S.cart.splice(i, 1); drawBar(); } }));
    })));
    var wait = S.data.provisional;          // still checking with the server: you can pick, not send yet
    bar.appendChild(h('button', { cls: 'btn', disabled: S.sending || wait ? 'disabled' : null,
      text: S.sending ? 'Sending…' : wait ? 'One moment — checking today\'s order…' : (S.data.mode === 'late' ? 'Send for approval' : 'Send order') + (total ? ' · ' + money(total, cur) : ''),
      onclick: function () { send(false); } }));
  }

  /*
   * The server needs 2–4 seconds. Cover the screen straight away so it's clear
   * something is happening and nothing can be tapped twice.
   */
  function busy(title, lines) {
    var slow = h('div', { cls: 'slow', text: 'Still working — Google is waking up the bot. One moment…' });
    var el = h('div', { cls: 'busy' }, h('div', { cls: 'spin' }), h('h1', { text: title }),
      lines && lines.length ? h('div', { cls: 'lines', text: lines.map(lineText).join(' + ') }) : null, slow);
    document.body.appendChild(el);
    var t = setTimeout(function () { slow.style.opacity = 1; }, 4500);
    return function () { clearTimeout(t); el.remove(); };
  }

  function send(skip) {
    if (S.sending) return;
    if (S.data && S.data.provisional) return toast('One moment — still checking today\'s order…');
    if (!skip && !S.cart.length) return toast('Add something first.');
    S.sending = true;
    haptic();
    var stop = busy(skip ? 'Skipping today…' : S.data.mode === 'late' ? 'Sending for approval…' : 'Sending your order…', skip ? [] : S.cart);
    api({ op: 'submit', skip: !!skip, lines: S.cart.map(function (l) {
      return { id: l.id || '', item: l.item, qty: l.qty || 1, sugar: l.sugar, ice: l.ice, opts: l.opts, note: l.note, part: l.part || '', custom: !!l.custom };
    }) }).then(function (r) {
      S.sending = false;
      stop();
      if (!r.ok) { drawBar(); haptic(); return toast(r.error || 'Could not send — try again.'); }
      haptic('ok');
      try { localStorage.removeItem(cacheKey()); } catch (e) {}
      var bar = document.querySelector('.bar'); if (bar) bar.remove();
      screen(skip ? '🙅' : (r.status === 'late' ? '⏳' : '✅'),
        skip ? 'Skipping today' : r.status === 'late' ? 'Sent for approval' : 'Order saved',
        skip ? '' : r.text + (r.status === 'ordered' && S.data.mode === 'open' ? ' — you can change it until ' + r.cutoff + '.' : ''),
        h('button', { cls: 'btn', text: 'Done', onclick: function () { tg ? tg.close() : history.back(); } }));
    }).catch(function () { S.sending = false; stop(); drawBar(); toast('No connection — nothing was sent. Try again.'); });
  }
})();
</script>
