<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review menu — Order Bot</title>
<script src="config.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, "Noto Sans Khmer", sans-serif; background: #f5f5f7; color: #111; padding-bottom: 110px; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border: 1px solid #e5e5ea; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #6e6e73; margin: 0 0 10px; font-weight: 600; }
  .muted { color: #6e6e73; font-size: 14px; }
  label { display: block; font-size: 13px; color: #6e6e73; margin: 12px 0 4px; }
  input[type=text], input[type=password], input[type=number], select { width: 100%; padding: 10px 12px; border: 1px solid #d2d2d7; border-radius: 10px; font: inherit; background: #fff; color: #111; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; padding: 9px 6px; border: 1px solid #d2d2d7; background: #fff; border-radius: 10px; font: inherit; }
  .seg button.on { background: #111; color: #fff; border-color: #111; }
  .cat { margin: 18px 4px 6px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .cat button { border: 0; background: none; color: #0a66c2; font: inherit; font-size: 13px; }
  .row { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid #f0f0f2; }
  .row:first-child { border-top: 0; }
  .row.off { opacity: .45; }
  .row input[type=checkbox] { width: 22px; height: 22px; flex: none; }
  .row img, .row .ph { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: #eee; flex: none; }
  .row .f { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .row .f input { padding: 6px 8px; font-size: 14px; }
  .row .pr { display: flex; gap: 6px; align-items: center; font-size: 13px; color: #6e6e73; }
  .row .pr input { width: 96px; }
  .tag { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: #fdecec; color: #8a1f1f; }
  .tag.opt { background: #eef3fb; color: #0b4c8c; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #e5e5ea; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bar .in { max-width: 640px; margin: 0 auto; }
  .btn { width: 100%; padding: 13px; border: 0; border-radius: 12px; background: #111; color: #fff; font: inherit; font-weight: 600; }
  .btn:disabled { opacity: .5; }
  .ok { background: #e8f6ec; color: #1d5e2f; padding: 12px; border-radius: 10px; margin-top: 10px; }
  .err { background: #fdecec; color: #8a1f1f; padding: 12px; border-radius: 10px; margin-top: 10px; }
  .tools { display: flex; gap: 8px; margin-top: 10px; }
  .tools button { flex: 1; padding: 8px; border: 1px solid #d2d2d7; background: #fff; border-radius: 10px; font: inherit; font-size: 14px; }
</style>
</head>
<body>
<main id="main"><p class="muted">Loading…</p></main>
<div class="bar" id="bar" style="display:none"><div class="in"><button class="btn" id="go">Import</button><div id="out"></div></div></div>
<script>
(function () {
  var main = document.getElementById('main'), bar = document.getElementById('bar');
  var data = null;
  try { data = JSON.parse(decodeURIComponent(location.hash.substring(1))); } catch (e) {}
  if (location.hash) history.replaceState(null, '', location.pathname);   // keep the menu out of the address bar

  if (!data || !data.items) {
    main.innerHTML = '<div class="card"><h1>Nothing to import</h1><p class="muted">Open a shop page (the Grab, E-Get or WOWNOW share link), ' +
      'run your <b>Send menu to Order Bot</b> bookmark, then press <b>Send to Order Bot</b>.</p>' +
      '<p><a href="bookmarklet.html">Set up the bookmark</a></p></div>';
    return;
  }
  if (!window.OB_API || /PASTE_/.test(window.OB_API)) {
    main.innerHTML = '<div class="card"><h1>Setup needed</h1><p class="muted">Put your web app URL in <code>config.js</code> first.</p></div>';
    return;
  }

  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var token = '';
  try { token = localStorage.getItem('ob_token') || ''; } catch (e) {}

  // Every item starts included except ones the page showed as sold out.
  var allSold = data.items.length >= 3 && data.items.filter(function (i) { return i.available === false; }).length / data.items.length >= 0.8;
  data.items.forEach(function (i) { i._on = true; i._sold = i.available === false && !allSold; });
  var S = { shops: [], shopId: '', name: data.shop_name || '', kind: '' };

  function post(body) {
    body.ob_import = 1; body.token = token;
    return fetch(window.OB_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }

  // One listener each for all rows (attached once, survives re-renders).
  main.addEventListener('change', function (e) {
    var t = e.target;
    if (t.type === 'checkbox' && t.dataset.i) { data.items[t.dataset.i]._on = t.checked; t.closest('.row').classList.toggle('off', !t.checked); count(); }
  });
  main.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.name) data.items[t.dataset.name].name = t.value;
    if (t.dataset.price) data.items[t.dataset.price].price = t.value === '' ? '' : Number(t.value);
  });

  if (!token) askToken(); else matchShop();

  function askToken(msg) {
    main.innerHTML = '<div class="card"><h1>' + esc(data.shop_name) + '</h1><div class="muted">' + esc(data.app) + ' · ' + data.items.length + ' items</div>' +
      '<label for="tok">BillSplit API token</label><input id="tok" type="password" autocomplete="off" placeholder="The API_TOKEN from Script Properties">' +
      '<div class="muted" style="font-size:13px;margin-top:4px">Saved in this browser only, so you enter it once.</div>' +
      (msg ? '<div class="err">' + esc(msg) + '</div>' : '') +
      '<button class="btn" id="tokgo" style="margin-top:14px">Continue</button></div>';
    document.getElementById('tokgo').onclick = function () {
      token = document.getElementById('tok').value.trim();
      if (!token) return;
      matchShop();
    };
  }

  function matchShop() {
    main.innerHTML = '<p class="muted">Checking your shops…</p>';
    post({ op: 'match', data: { page_url: data.page_url, shop_name: data.shop_name, app: data.app } }).then(function (r) {
      if (!r.ok) { token = ''; try { localStorage.removeItem('ob_token'); } catch (e) {} return askToken(r.error); }
      try { localStorage.setItem('ob_token', token); } catch (e) {}
      S.shops = r.shops || [];
      S.shopId = r.match || 'new';
      var m = S.shops.filter(function (s) { return s.id === S.shopId; })[0];
      if (m) { S.name = m.name; S.kind = m.kind; }
      render();
    }).catch(function () { main.innerHTML = '<div class="card err">Could not reach your bot. Check config.js and your connection.</div>'; });
  }

  function render() {
    var cats = [];
    data.items.forEach(function (i) { if (cats.indexOf(i.category) === -1) cats.push(i.category); });
    var opts = S.shops.map(function (s) {
      return '<option value="' + esc(s.id) + '"' + (s.id === S.shopId ? ' selected' : '') + '>' + esc(s.id + ' · ' + s.name + ' · ' + s.app) +
        (s.menu_count ? ' (menu: ' + s.menu_count + ')' : '') + '</option>';
    }).join('') + '<option value="new"' + (S.shopId === 'new' ? ' selected' : '') + '>➕ New shop</option>';

    main.innerHTML =
      '<div class="card"><h2>Shop</h2>' +
      '<div class="muted">Read from ' + esc(data.app) + ' · ' + data.items.length + ' items' + (allSold ? ' · shop looked closed, sold-out marks ignored' : '') + '</div>' +
      '<label for="shop">Save to</label><select id="shop">' + opts + '</select>' +
      '<label for="nm">Name the team sees</label><input id="nm" type="text" value="' + esc(S.name) + '">' +
      '<label>Used for</label><div class="seg" id="kind">' +
        ['coffee', 'lunch', 'both'].map(function (k) {
          return '<button data-k="' + k + '" class="' + (S.kind === k ? 'on' : '') + '">' + { coffee: '☕ Coffee', lunch: '🍱 Lunch', both: 'Both' }[k] + '</button>';
        }).join('') + '</div>' +
      (S.shopId !== 'new' ? '<div class="muted" style="font-size:13px;margin-top:8px">Importing replaces this shop\'s current menu. Past orders are not affected.</div>' : '') +
      '</div>' +
      '<div class="card"><h2>Items</h2><div class="muted">Untick anything the team shouldn\'t see. Tap a name or price to fix it.</div>' +
      '<div class="tools"><button id="all">Tick all</button><button id="none">Untick all</button></div>' +
      cats.map(function (c, ci) {
        return '<div class="cat"><span>' + esc(c) + '</span><button data-cat="' + ci + '">Untick section</button></div><div>' +
          data.items.map(function (it, i) {
            if (it.category !== c) return '';
            return '<div class="row' + (it._on ? '' : ' off') + '" data-i="' + i + '">' +
              '<input type="checkbox" data-i="' + i + '"' + (it._on ? ' checked' : '') + ' aria-label="Include">' +
              (it.image ? '<img src="' + esc(it.image) + '" alt="" loading="lazy">' : '<div class="ph"></div>') +
              '<div class="f"><input type="text" data-name="' + i + '" value="' + esc(it.name) + '">' +
              '<div class="pr"><input type="number" step="any" inputmode="decimal" data-price="' + i + '" value="' + esc(it.price) + '"> ' +
              (it.currency === 'KHR' ? '៛' : 'USD') +
              (it._sold ? ' <span class="tag">sold out</span>' : '') +
              (it.options && it.options.length ? ' <span class="tag opt">' + it.options.length + ' option' + (it.options.length > 1 ? 's' : '') + '</span>' : '') +
              '</div></div></div>';
          }).join('') + '</div>';
      }).join('') + '</div>';

    document.getElementById('shop').onchange = function () {
      S.shopId = this.value;
      var m = S.shops.filter(function (s) { return s.id === S.shopId; })[0];
      if (m) { S.name = m.name; S.kind = m.kind; } else { S.name = data.shop_name || ''; S.kind = ''; }
      render();
    };
    document.getElementById('nm').oninput = function () { S.name = this.value; };
    [].forEach.call(document.querySelectorAll('#kind button'), function (b) {
      b.onclick = function () { S.kind = b.dataset.k; [].forEach.call(b.parentNode.children, function (x) { x.classList.toggle('on', x === b); }); };
    });
    document.getElementById('all').onclick = function () { data.items.forEach(function (i) { i._on = true; }); render(); };
    document.getElementById('none').onclick = function () { data.items.forEach(function (i) { i._on = false; }); render(); };
    [].forEach.call(document.querySelectorAll('[data-cat]'), function (b) {
      b.onclick = function () { var c = cats[b.dataset.cat]; data.items.forEach(function (i) { if (i.category === c) i._on = false; }); render(); };
    });
    bar.style.display = 'block';
    count();
  }

  function count() {
    var n = data.items.filter(function (i) { return i._on; }).length;
    var go = document.getElementById('go');
    go.disabled = !n;
    go.textContent = n ? 'Import ' + n + ' of ' + data.items.length + ' items' : 'Tick at least one item';
  }

  document.getElementById('go').onclick = function () {
    var btn = this, out = document.getElementById('out');
    var name = String(S.name || '').trim();
    if (!name) { out.innerHTML = '<div class="err">Give the shop a name.</div>'; return; }
    if (S.shopId === 'new' && !S.kind) { out.innerHTML = '<div class="err">Choose ☕ Coffee, 🍱 Lunch or Both.</div>'; return; }
    var items = data.items.filter(function (i) { return i._on && String(i.name).trim(); }).map(function (i) {
      return { category: i.category, name: String(i.name).trim(), desc: i.desc, price: i.price, was: i.was, currency: i.currency,
               image: i.image, available: allSold ? true : !i._sold, options: i.options || [] };
    });
    btn.disabled = true; btn.textContent = 'Importing…'; out.innerHTML = '';
    post({ shop_id: S.shopId, shop_name: name, kind: S.kind, data: { app: data.app, shop_name: data.shop_name, page_url: data.page_url, items: items } })
      .then(function (r) {
        if (!r.ok) throw new Error(r.error || 'Import failed');
        btn.textContent = 'Imported ✓';
        out.innerHTML = '<div class="ok"><b>' + esc(r.shop_name) + '</b> — ' + r.count + ' items saved' +
          (r.new_shop ? ' as a new shop (' + esc(r.shop_id) + ')' : '') + '. You can close this tab.</div>';
      })
      .catch(function (e) { btn.disabled = false; count(); out.innerHTML = '<div class="err">' + esc(e.message || e) + '</div>'; });
  };
})();
</script>
</body>
</html>
