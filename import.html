<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import menu — Order Bot</title>
<script src="config.js"></script>
<style>
  body { margin: 0; font: 15px/1.5 -apple-system, system-ui, "Segoe UI", Roboto, "Noto Sans Khmer", sans-serif; background: #f5f5f7; color: #111; }
  main { max-width: 560px; margin: 32px auto; padding: 24px; background: #fff; border-radius: 16px; border: 1px solid #e5e5ea; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: #6e6e73; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0; }
  .grid div { font-size: 12px; text-align: center; }
  .grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: #eee; display: block; margin-bottom: 4px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d2d2d7; border-radius: 10px; font: inherit; }
  button { margin-top: 16px; width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #111; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; }
  .ok { background: #e8f6ec; color: #1d5e2f; padding: 12px; border-radius: 10px; margin-top: 16px; }
  .err { background: #fdecec; color: #8a1f1f; padding: 12px; border-radius: 10px; margin-top: 16px; }
</style>
</head>
<body>
<main id="main"><p class="muted">Loading…</p></main>
<script>
(function () {
  var main = document.getElementById('main');
  var data = null;
  try { data = JSON.parse(decodeURIComponent(location.hash.substring(1))); } catch (e) {}
  if (location.hash) history.replaceState(null, '', location.pathname);   // don't keep the menu in the address bar

  if (!data || !data.items) {
    main.innerHTML = '<h1>Nothing to import</h1><p class="muted">Open a shop page in Chrome (the Grab or E-Get share link), ' +
      'click your <b>Send menu to Order Bot</b> bookmark, then press <b>Send to Order Bot</b>.</p>' +
      '<p><a href="bookmarklet.html">Set up the bookmark</a></p>';
    return;
  }
  if (!window.OB_API || /PASTE_/.test(window.OB_API)) {
    main.innerHTML = '<h1>Setup needed</h1><p class="muted">Put your web app URL in <code>config.js</code> first.</p>';
    return;
  }

  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var cats = {};
  data.items.forEach(function (i) { cats[i.category] = 1; });
  var sold = data.items.filter(function (i) { return i.available === false; }).length;
  var opts = data.items.filter(function (i) { return i.options && i.options.length; }).length;
  var saved = '';
  try { saved = localStorage.getItem('ob_token') || ''; } catch (e) {}

  main.innerHTML =
    '<h1>' + esc(data.shop_name) + '</h1>' +
    '<div class="muted">' + esc(data.app) + ' · ' + data.items.length + ' items · ' + Object.keys(cats).length + ' categories' +
    (opts ? ' · ' + opts + ' with options' : '') + (sold ? ' · ' + sold + ' sold out' : '') + '</div>' +
    '<div class="grid">' + data.items.slice(0, 8).map(function (i) {
      return '<div>' + (i.image ? '<img src="' + esc(i.image) + '" alt="" loading="lazy">' : '<img alt="">') + esc(i.name) + '</div>';
    }).join('') + '</div>' +
    '<label for="tok">BillSplit API token</label>' +
    '<input id="tok" type="password" autocomplete="off" placeholder="The API_TOKEN from your Script Properties" value="' + esc(saved) + '">' +
    '<div class="muted" style="font-size:13px;margin-top:4px">Saved in this browser only, so you enter it once.</div>' +
    '<button id="go">Import ' + data.items.length + ' items</button><div id="out"></div>';

  document.getElementById('go').onclick = function () {
    var btn = this, tok = document.getElementById('tok').value.trim(), out = document.getElementById('out');
    if (!tok) { out.innerHTML = '<div class="err">Enter your API token first.</div>'; return; }
    btn.disabled = true; btn.textContent = 'Importing…'; out.innerHTML = '';
    fetch(window.OB_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                           body: JSON.stringify({ ob_import: 1, token: tok, data: data }) })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (!r.ok) throw new Error(r.error || 'Import failed');
        try { localStorage.setItem('ob_token', tok); } catch (e) {}
        btn.textContent = 'Imported ✓';
        out.innerHTML = '<div class="ok"><b>' + esc(r.shop_name) + '</b> — ' + r.count + ' items saved' +
          (r.new_shop ? '. It was a new shop, so it\'s been added to your whitelist — check Telegram to set coffee or lunch.' : '.') +
          '<br>You can close this tab.</div>';
      })
      .catch(function (e) {
        btn.disabled = false; btn.textContent = 'Try again';
        out.innerHTML = '<div class="err">' + esc(e.message || e) + '</div>';
      });
  };
})();
</script>
</body>
</html>
